<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blin 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #9aa0a6;
    transition: opacity .8s; pointer-events: none; padding: 0 16px;
  }
  #lang {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 2px;
    font: 12px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #lang button {
    font: inherit; letter-spacing: .04em; color: #9aa0a6; background: none; border: 0;
    padding: 6px 7px; border-radius: 6px; cursor: pointer;
  }
  #lang button:hover { color: #3c4043; }
  #lang button[aria-pressed="true"] { color: #202124; background: #f1f3f4; font-weight: 600; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; color: #9aa0a6;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/build/three.module.min.js",
    "three/addons/": "./vendor/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">загрузка…</div>
<div id="hint"></div>
<nav id="lang" aria-label="Язык экрана"></nav>
<script type="module" src="./main.js"></script>
</body>
</html>
