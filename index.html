<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blin 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #9aa0a6;
    transition: opacity .8s; pointer-events: none; padding: 0 16px;
  }
  #lang {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 2px;
    font: 12px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #lang button {
    font: inherit; letter-spacing: .04em; color: #9aa0a6; background: none; border: 0;
    padding: 6px 7px; border-radius: 6px; cursor: pointer;
  }
  #lang button:hover { color: #3c4043; }
  #lang button[aria-pressed="true"] { color: #202124; background: #f1f3f4; font-weight: 600; }
  /* подсказки: белый кружок с прозрачным плюсом, наведение — плашка с текстом */
  #hints { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .hint { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .3s; }
  .hint.on { opacity: 1; }
  .hint button {
    position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; padding: 0;
    border: 0; background: none; cursor: pointer; pointer-events: none;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .35)); transition: transform .15s;
  }
  .hint.on button { pointer-events: auto; }
  .hint button svg { display: block; width: 24px; height: 24px; }
  .hint:hover button, .hint.open button { transform: scale(1.18); }
  .hint-label {
    position: absolute; left: 20px; top: 0; transform: translateY(-50%);
    width: max-content; max-width: min(240px, calc(100vw - 72px)); padding: 7px 10px; border-radius: 8px;
    background: #fff; color: #202124; box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
    font: 13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .hint.left .hint-label { left: auto; right: 20px; }
  .hint:hover .hint-label, .hint.open .hint-label { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint, .hint button, .hint-label { transition: none; } }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; color: #9aa0a6;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/build/three.module.min.js",
    "three/addons/": "./vendor/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">загрузка…</div>
<div id="hints"></div>
<div id="hint"></div>
<nav id="lang" aria-label="Язык экрана"></nav>
<script type="module" src="./main.js"></script>
</body>
</html>
